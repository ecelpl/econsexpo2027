name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
      # Keep earlier versions online so the directions can be compared: version 1 at /v1/.
      - uses: actions/checkout@v4
        with:
          ref: v1
          path: v1-src
      - run: cd v1-src && npm ci && npm run build && mv out ../out/v1
        env:
          NEXT_PUBLIC_BASE_PATH: /v1
      # And version 2 at /v2/.
      - uses: actions/checkout@v4
        with:
          ref: v2
          path: v2-src
      - run: cd v2-src && npm ci && npm run build && mv out ../out/v2
        env:
          NEXT_PUBLIC_BASE_PATH: /v2
      # And version 3 at /v3/.
      - uses: actions/checkout@v4
        with:
          ref: v3
          path: v3-src
      - run: cd v3-src && npm ci && npm run build && mv out ../out/v3
        env:
          NEXT_PUBLIC_BASE_PATH: /v3
      # And version 4 at /v4/ (the site as it was when the domain went live, 5 Nov 2026).
      - uses: actions/checkout@v4
        with:
          ref: v4
          path: v4-src
      - run: cd v4-src && npm ci && npm run build && mv out ../out/v4
        env:
          NEXT_PUBLIC_BASE_PATH: /v4
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
